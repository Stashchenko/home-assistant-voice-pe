esphome:
  name: test-mic
  friendly_name: Test Mic
  name_add_mac_suffix: true
  min_version: 2025.12.0

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    version: 5.5.1
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Moves instructions and read only data from flash into PSRAM on boot.
      # Both enabled allows instructions to execute while a flash operation is in progress without needing to be placed in IRAM.
      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

      # enable psram 
      CONFIG_SPIRAM_MODE_OCT: "y"
      CONFIG_SPIRAM: "y"
      CONFIG_ESPTOOLPY_FLASHMODE_QIO: "y"
      CONFIG_ESPTOOLPY_FLASHFREQ_80M: "y"
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"

wifi:
  id: wifi_id
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "Voice-Assistant-Pe"
    password: "oYwAJRTZ6jH3"

network:
  enable_ipv6: true

logger:
  level: DEBUG

api:
  id: api_id
  encryption:
    key: "Dg4wjJ8iaxi0PuU+m9xR/om79/C+Oi1wQ2wlPNGvHsY="

ota:
  - platform: esphome
    password: "b5c10a8511fdaf65d2f526d94a73e392"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false  # The VPE has PSRAM, so this is safe. Allows configuring WiFi driver to use more resources (done automatically by the speaker media player)

globals:
  - id: recorded_audio
    type: std::vector<std::vector<uint8_t>>
    restore_value: false
    initial_value: 'std::vector<std::vector<uint8_t>>{}'
switch:
  - platform: template
    optimistic: True
    name: "Record Mic"
    id: record_switch
    turn_on_action:
      - logger.log: "Recording started"
      - lambda: |-
          id(recorded_audio).clear();    
      - microphone.capture: i2s_mics
    turn_off_action:
      - delay: 1s
      - lambda: |-
          auto &buffer = id(recorded_audio);
          ESP_LOGI("recorded_audio", "Captured %u chunks", buffer.size());

          for (auto &chunk : buffer) {
              id(i2s_audio_speaker).play(chunk.data(), chunk.size());
              // Calculate approximate delay in microseconds
              uint32_t us_delay = (chunk.size() / 2) * 62;  // ~62 µs per 16-bit sample
              if (us_delay < 1) us_delay = 1;               // safety
              esphome::delay_microseconds_safe(us_delay);
          }
          
          buffer.clear();  

binary_sensor:
  - platform: status
    name: "Device Status"

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin: GPIO19
    i2s_bclk_pin: GPIO18

  - id: i2s_input
    i2s_lrclk_pin: GPIO3  #WS 
    i2s_bclk_pin: GPIO2 #SCK    


microphone:
  - platform: i2s_audio
    id: i2s_mics
    i2s_din_pin: GPIO4 #SD
    adc_type: external
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    i2s_audio_id: i2s_input
    on_data:
      - lambda: |-
          if (id(record_switch).state) {              
              ESP_LOGI("microphone", "Received %d bytes", x.size());
              id(recorded_audio).push_back(x);
          }      

speaker:
  # Hardware speaker output
  - platform: i2s_audio
    id: i2s_audio_speaker
    sample_rate: 16000
    i2s_dout_pin: GPIO21 #DIN Pin of the MAX98357A Audio Amplifier
    bits_per_sample: 16bit
    i2s_audio_id: i2s_output
    dac_type: external
    channel: mono
    timeout: never
    buffer_duration: 150ms

http_request:

button:
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

debug:
  update_interval: 5s



text_sensor:
  # Send IP Address
  - platform: wifi_info
    ip_address:
      name: IP
      icon: mdi:ip-network
    ssid:
      name: SSID
      icon: mdi:router-wireless

    mac_address:
      name: Wifi Address

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    id: wifi_signal_db
    entity_category: "diagnostic"
    internal: true  # hide this sensor to HA,

  - platform: copy
    source_id: wifi_signal_db
    name: "WiFi Signal Percent"
    icon: mdi:wifi
    filters:
      - lambda: return min(max(2 * (x + 100.0), 0.0), 100.0);
    unit_of_measurement: " %"
    entity_category: "diagnostic"
    device_class: ""
